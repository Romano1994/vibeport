name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}   # Cloudflare Tunnel SSH 호스트 (예: ssh.nbbang.xyz)
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Configure SSH (via Cloudflare Tunnel)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 서버(Mac mini) 호스트 키 고정 - 중간자 공격 방지
          echo "$SSH_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGutLSsJ1itDVgsTS1lwXdjB3eF9gXnNsn5ER6tKRwTW" > ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host deploy-server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h
            ServerAliveInterval 30
          EOF

      - name: Deploy
        run: |
          ssh deploy-server 'bash -s' <<'SCRIPT'
          set -euo pipefail

          # 비대화형 SSH 세션에는 Homebrew 경로가 없으므로 직접 추가
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export DOCKER_CONTEXT=colima

          cd "$HOME/apps/vibeport"

          echo "▶ 소스 업데이트"
          git fetch origin main
          git reset --hard origin/main

          echo "▶ 롤백용 이미지 태그"
          docker image tag vibeport-frontend:latest vibeport-frontend:rollback || true
          docker image tag vibeport-backend:latest vibeport-backend:rollback || true

          echo "▶ 빌드 & 재시작"
          docker-compose build
          docker-compose up -d --remove-orphans

          echo "▶ 정리"
          docker image prune -f
          docker builder prune -f --filter "until=168h"

          docker-compose ps
          SCRIPT

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
