name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ec2-user/apps/vibeport/
            git config --global --add safe.directory /home/ec2-user/apps/vibeport/
            sudo docker image tag vibeport-front:latest vibeport_front:rollback || true
            sudo docker image tag vibeport-backend:latest vibeport-backend:rollback || true
            git pull origin main
            sudo docker compose build --no-cache
            sudo docker compose up -d
            sudo docker image prune -f
            sudo docker builder prune -f
