services:
  db:
    image: mariadb:10.11
    container_name: ${DB_CONTAINER_NAME:-vibeport-db}
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${DB_DATABASE:-vibeport}
      MARIADB_USER: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      MARIADB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - vibeport-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./vibeport_back
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME:-vibeport-backend}
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-smtp.gmail.com}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_FROM: ${MAIL_SMTP_FROM:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_ERROR_EMAIL: ${MAIL_SMTP_ERROR_EMAIL:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_ACCESS: ${JWT_EXPIRATION_ACCESS:-900000}
      JWT_EXPIRATION_REFRESH: ${JWT_EXPIRATION_REFRESH:-86400000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SPRING_AI_GEMINI_API_KEY: ${SPRING_AI_GEMINI_API_KEY:-}
      SPRING_AI_GEMINI_CHAT_OPTIONS_TIMEOUT: ${SPRING_AI_GEMINI_CHAT_OPTIONS_TIMEOUT:-180s}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      SPRING_AI_OPENAI_BASE_URL: ${SPRING_AI_OPENAI_BASE_URL:-https://api.perplexity.ai}
      SPRING_AI_OPENAI_CHAT_COMPLETIONS_PATH: ${SPRING_AI_OPENAI_CHAT_COMPLETIONS_PATH:-/chat/completions}
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:-sonar-pro}
      SPRING_AI_OPENAI_CHAT_OPTIONS_TEMPERATURE: ${SPRING_AI_OPENAI_CHAT_OPTIONS_TEMPERATURE:-0.0}
      SPRING_AI_OPENAI_CHAT_OPTIONS_MAX_TOKENS: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MAX_TOKENS:-4096}
      SPRING_AI_OPENAI_CHAT_OPTIONS_CONNECT_TIMEOUT: ${SPRING_AI_OPENAI_CHAT_OPTIONS_CONNECT_TIMEOUT:-30000}
      SPRING_AI_OPENAI_CHAT_OPTIONS_READ_TIMEOUT: ${SPRING_AI_OPENAI_CHAT_OPTIONS_READ_TIMEOUT:-120000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
      OPENAI_RESPONSES_MODEL: ${OPENAI_RESPONSES_MODEL:-gpt-4.1}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-}
      AWS_SES_SEND_MAIL_FROM: ${AWS_SES_SEND_MAIL_FROM:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      NEWSLETTER_LAUNCH_DATE: ${NEWSLETTER_LAUNCH_DATE:-2026-05-01}
      NEWSLETTER_SEND_TIME_TEXT: ${NEWSLETTER_SEND_TIME_TEXT:-09:00}
      APP_IMAGE_DIR: ${APP_IMAGE_DIR:-./data/concert_images/}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
      BATCH_GEMINI_CONCERT_ENABLED: ${BATCH_GEMINI_CONCERT_ENABLED:-false}
      BATCH_GEMINI_CONCERT_CRON: ${BATCH_GEMINI_CONCERT_CRON:-0 30 8 * * *}
      BATCH_DAILY_PIPELINE_ENABLED: ${BATCH_DAILY_PIPELINE_ENABLED:-true}
      BATCH_DAILY_PIPELINE_CRON: ${BATCH_DAILY_PIPELINE_CRON:-0 30 8 * * *}
      BATCH_DAILY_CONCERT_COLLECTION_ENABLED: ${BATCH_DAILY_CONCERT_COLLECTION_ENABLED:-true}
      BATCH_DAILY_CONCERT_COLLECTION_CRON: ${BATCH_DAILY_CONCERT_COLLECTION_CRON:-0 0 6 * * *}
      BATCH_DAILY_CONCERT_COLLECTION_ZONE: ${BATCH_DAILY_CONCERT_COLLECTION_ZONE:-Asia/Seoul}
      BATCH_DAILY_NEWSLETTER_ENABLED: ${BATCH_DAILY_NEWSLETTER_ENABLED:-true}
      BATCH_DAILY_NEWSLETTER_CRON: ${BATCH_DAILY_NEWSLETTER_CRON:-0 30 8 * * *}
      BATCH_DAILY_NEWSLETTER_ZONE: ${BATCH_DAILY_NEWSLETTER_ZONE:-Asia/Seoul}
      BATCH_MISSING_CONCERT_INFO_ENABLED: ${BATCH_MISSING_CONCERT_INFO_ENABLED:-true}
      BATCH_MISSING_CONCERT_INFO_CRON: ${BATCH_MISSING_CONCERT_INFO_CRON:-0 0 5 * * *}
      BATCH_MISSING_CONCERT_INFO_ZONE: ${BATCH_MISSING_CONCERT_INFO_ZONE:-Asia/Seoul}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    volumes:
      - concert_images:/app/data/concert_images
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vibeport-network
    restart: unless-stopped

  frontend:
    build:
      context: ./vibeport_front
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-/vibeport}
    container_name: ${FRONTEND_CONTAINER_NAME:-vibeport-frontend}
    environment:
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - vibeport-network
    restart: unless-stopped

networks:
  vibeport-network:
    driver: bridge

volumes:
  db_data:
  concert_images:
